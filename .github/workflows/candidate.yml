name: Publish candidate

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Create unique candidate version
        id: candidate
        run: |
          set -euo pipefail
          version="$(python scripts/candidate_version.py --write-project-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build candidate wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Check PyPI for an existing candidate
        id: existing
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/check_pypi_candidate.py \
            --version "$CANDIDATE_VERSION" \
            --wheel "$wheel" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish candidate to PyPI
        if: steps.existing.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
