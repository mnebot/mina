name: Candidate and deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: mina-candidate-deployment
  cancel-in-progress: false

jobs:
  build_candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.pull_requests[0].base.ref == 'master'
        ) ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Resolve the validated source ref
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.event === "pull_request") {
              const associations = run.pull_requests;
              if (!Array.isArray(associations) || associations.length !== 1) {
                throw new Error("Expected exactly one pull request for the CI run");
              }
              const association = associations[0];
              if (association.base.ref !== "master" ||
                  association.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  association.head.sha !== run.head_sha) {
                throw new Error("The CI run is not for a same-repository master pull request");
              }
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: association.number
              });
              if (pullRequest.state !== "open" ||
                  pullRequest.base.ref !== "master" ||
                  pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  pullRequest.head.sha !== association.head.sha ||
                  pullRequest.base.sha !== association.base.sha) {
                throw new Error("The pull request changed after CI; wait for its latest CI run");
              }
              if (!/^[0-9a-f]{40}$/i.test(pullRequest.merge_commit_sha ?? "")) {
                throw new Error("GitHub did not provide the validated pull-request merge commit");
              }
              core.setOutput("ref", pullRequest.merge_commit_sha);
            } else if (run.event === "push" && run.head_branch === "master") {
              core.setOutput("ref", run.head_sha);
            } else {
              throw new Error("Unsupported CI event for candidate publication");
            }

      - name: Check out the validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          path: source
          persist-credentials: false

      - name: Check out trusted release helpers
        uses: actions/checkout@v4
        with:
          ref: master
          path: trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r trusted/requirements-dev.txt

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git -C source show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Create unique candidate version
        id: candidate
        run: |
          set -euo pipefail
          version="$(python trusted/scripts/candidate_version.py \
            --project-file source/pyproject.toml \
            --write-project-version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build candidate wheel
        run: |
          set -euo pipefail
          mkdir -p dist
          python -m pip wheel source --no-deps --wheel-dir dist

      - name: Verify candidate wheel identity
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          python - "$CANDIDATE_VERSION" <<'PY'
          import re
          import sys
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one candidate wheel")
          with ZipFile(wheels[0]) as archive:
              metadata_files = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_files) != 1:
                  raise SystemExit("Wheel must contain exactly one METADATA file")
              metadata = Parser().parsestr(
                  archive.read(metadata_files[0]).decode("utf-8")
              )
          distribution = re.sub(r"[-_.]+", "-", metadata.get("Name", "")).lower()
          if distribution != "mina-voice-assistant":
              raise SystemExit("Wheel has an unexpected distribution name")
          if metadata.get("Version") != sys.argv[1]:
              raise SystemExit("Wheel has an unexpected candidate version")
          PY

      - name: Record built source commit
        id: commit
        run: |
          set -euo pipefail
          echo "commit=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload candidate wheel
        uses: actions/upload-artifact@v4
        with:
          name: mina-candidate-wheel-${{ github.run_id }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build_candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted release helpers
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download candidate wheel
        uses: actions/download-artifact@v4
        with:
          name: mina-candidate-wheel-${{ github.run_id }}
          path: dist/

      - name: Check PyPI for an existing candidate
        id: existing
        env:
          CANDIDATE_VERSION: ${{ needs.build_candidate.outputs.version }}
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/check_pypi_candidate.py \
            --version "$CANDIDATE_VERSION" \
            --wheel "$wheel" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish candidate to PyPI
        if: steps.existing.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  deploy:
    needs:
      - build_candidate
      - publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out trusted deployment helpers
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize redacted diagnostics
        run: |
          printf '%s\n' \
            'Deployment failed before per-device results; inspect the failed workflow step.' \
            'If deployment reached a device, its full logs are at /var/log/mina/deploy.log and /var/log/mina/service.log.' \
            > "$RUNNER_TEMP/mina-deployment-diagnostics.txt"

      - name: Register device validation
        id: deployment
        uses: actions/github-script@v7
        env:
          CANDIDATE_VERSION: ${{ needs.build_candidate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build_candidate.outputs.commit }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.SOURCE_COMMIT,
              environment: "mina-pi-candidate",
              description: `Validating ${process.env.CANDIDATE_VERSION}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              payload: JSON.stringify({
                candidateWorkflowRunId: context.runId,
                candidateVersion: process.env.CANDIDATE_VERSION,
                sourceCommit: process.env.SOURCE_COMMIT,
                sourceEvent: process.env.SOURCE_EVENT,
                sourceBranch: process.env.SOURCE_BRANCH
              })
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "in_progress",
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setOutput("deployment_id", String(deployment.data.id));

      - name: Validate PR test-device inventory
        if: github.event.workflow_run.event == 'pull_request'
        env:
          MINA_TARGETS_JSON: ${{ secrets.MINA_PR_TARGETS_JSON }}
        run: >-
          python scripts/deployment_targets.py
          --output "$RUNNER_TEMP/mina-targets.json"

      - name: Validate master deployment inventory
        if: github.event.workflow_run.event == 'push'
        env:
          MINA_TARGETS_JSON: ${{ secrets.MINA_TARGETS_JSON }}
        run: >-
          python scripts/deployment_targets.py
          --output "$RUNNER_TEMP/mina-targets.json"

      - name: Connect runner to the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Deploy candidate to the selected devices
        run: |
          set -euo pipefail
          python scripts/deploy_candidate.py \
            --inventory "$RUNNER_TEMP/mina-targets.json" \
            --version "${{ needs.build_candidate.outputs.version }}" \
            --diagnostics-file "$RUNNER_TEMP/mina-deployment-diagnostics.txt"

      - name: Record device validation result
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOYMENT_RESULT: ${{ job.status }}
        with:
          script: |
            if (!process.env.DEPLOYMENT_ID) {
              core.warning("No deployment record was created; stable promotion will remain blocked.");
              return;
            }
            const state = process.env.DEPLOYMENT_RESULT === "success"
              ? "success"
              : process.env.DEPLOYMENT_RESULT === "cancelled"
                ? "inactive"
                : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Upload redacted deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mina-deployment-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/mina-deployment-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
