name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression tests
        run: python -m pytest

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          export MINA_EXPECTED_VERSION="${expected_version}"
          python -m venv "$RUNNER_TEMP/mina-wheel-smoke"
          "$RUNNER_TEMP/mina-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mina-wheel-smoke/bin/python" - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path

          import mina
          from mina import Core

          class Output:
              def __init__(self):
                  self.response = None

              def send(self, response):
                  self.response = response

          assert importlib.metadata.version("mina-voice-assistant") == os.environ["MINA_EXPECTED_VERSION"]
          assert "site-packages" in str(Path(mina.__file__).resolve())
          output = Output()
          Core(output).submit("encén el llum")
          assert output.response == "He rebut: encén el llum"
          PY
