[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mina-voice-assistant"
version = "0.1.0"
description = "Lightweight core for a multilingual home voice assistant."
dependencies = []

[project.scripts]
mina = "mina.cli:main"
mina-service = "mina.service:main"

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
